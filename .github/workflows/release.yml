name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - package.json

# Releases publish to a registry and cut tags — queue them instead of
# cancelling, so a superseded run never leaves a half-published version.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Publish to npm.celados.com
    runs-on: celados-linux
    timeout-minutes: 15
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.2

      - name: Write registry auth
        run: |
          set -euo pipefail
          # Quoted heredoc keeps ${NODE_AUTH_TOKEN} literal; npm expands it from env.
          cat > .npmrc <<'EOF'
          @celados:registry=https://npm.celados.com
          //npm.celados.com/:_authToken=${NODE_AUTH_TOKEN}
          EOF

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail

          NAME="$(node -p 'require("./package.json").name')"
          VERSION="$(node -p 'require("./package.json").version')"

          # The registry is the release ledger: a version already published is done.
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published"
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST="$(npm view "$NAME" version 2>/dev/null || true)"
          if [[ -n "$LATEST" ]] && ! bun -e "import { semver } from 'bun'; process.exit(semver.order('$VERSION', '$LATEST') === 1 ? 0 : 1)"; then
            echo "package.json version $VERSION must be greater than published $LATEST"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "released=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.version.outputs.released == 'true'
        run: bun install --frozen-lockfile

      - name: Check source
        if: steps.version.outputs.released == 'true'
        run: bun run check

      - name: Publish
        if: steps.version.outputs.released == 'true'
        # `files` in package.json selects src and LICENSE; .npmrc never enters the tarball.
        run: npm publish --access public

      - name: Tag release
        if: steps.version.outputs.released == 'true'
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
