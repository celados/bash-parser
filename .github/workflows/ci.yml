name: CI

# Release runs `check` only when package.json changes; every other push and PR
# is gated here, on the same runner. `check` includes the differential suite.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'celados-linux' }}
    timeout-minutes: 15
    env:
      CELADOS_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.2

      - uses: celados/.github/actions/setup-celados-npm@setup-celados-npm-v1
      - run: bun install --frozen-lockfile
      - run: bun run check
